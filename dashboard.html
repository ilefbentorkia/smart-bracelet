<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Employee Bracelet</title>
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                <span>SmartBracelet</span>
            </div>
            <ul class="nav-links">
                <li><a href="htl.html">Accueil</a></li>
                <li><a href="dashbord.html" class="active">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="dashboard-header">
                <h1><i class="fas fa-chart-line"></i> Tableau de Bord</h1>
                <div class="last-update">
                    <i class="fas fa-sync-alt"></i>
                    <span id="last-update-time">Dernière mise à jour: --</span>
                </div>
            </div>

            <div class="dashboard-grid">
                
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-clock"></i> Présence du Jour</h3>
                        <i class="fas fa-ellipsis-h"></i>
                    </div>
                    <div class="card-body">
                        <div id="attendance-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

                <!-- Graphique Fréquence Cardiaque -->
                <div class="dashboard-card full-width">
                    <div class="card-header">
                        <h3><i class="fas fa-heartbeat"></i> Fréquence Cardiaque - Dernières 24h</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="heartRateChart"></canvas>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-users"></i> Employés</h3>
                        <input type="text" id="search-employee" placeholder="Rechercher..." class="search-input">
                    </div>
                    <div class="card-body">
                        <div id="employees-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-bell"></i> Alertes Santé</h3>
                        <span class="badge" id="alert-count">0</span>
                    </div>
                    <div class="card-body">
                        <div id="alerts-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-thermometer-half"></i> Températures</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
<script>
async function loadDashboard() {
    try {
        const res = await fetch('http://localhost/smart-bracelet-site/dashboard.php');
        const data = await res.json();
        const attendanceDiv = document.getElementById('attendance-list');
        attendanceDiv.innerHTML = data.attendance.map(a => `
            <p>
                ${a.nom} ${a.prenom} 
                → Entrée: ${a.check_in || '--'} 
                | Sortie: ${a.check_out || '--'}
            </p>
        `).join('');

       
        const empDiv = document.getElementById('employees-list');
        empDiv.innerHTML = data.employees.map(e => `
            <p>${e.nom} ${e.prenom} - ${e.department}</p>
        `).join('');

        const alertDiv = document.getElementById('alerts-list');
        alertDiv.innerHTML = data.alerts.map(a => `
            <p style="color:red;">
                ⚠ ${a.nom} : ${a.alert_message} (${a.niveau})
            </p>
        `).join('');

        document.getElementById('alert-count').textContent = data.alerts.length;

       
        new Chart(document.getElementById('heartRateChart'), {
            type: 'line',
            data: {
                labels: data.heartRate.map((_, i) => i),
                datasets: [{
                    label: 'BPM',
                    data: data.heartRate
                }]
            }
        });

        new Chart(document.getElementById('temperatureChart'), {
            type: 'line',
            data: {
                labels: data.temperature.map((_, i) => i),
                datasets: [{
                    label: '°C',
                    data: data.temperature
                }]
            }
        });

        document.getElementById('last-update-time').textContent =
            "Dernière mise à jour: " + new Date().toLocaleTimeString();

    } catch (err) {
        console.error("Erreur:", err);
    }
}


loadDashboard();
setInterval(loadDashboard, 5000);</script>
</html>
