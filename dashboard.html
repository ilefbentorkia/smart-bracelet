<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Employee Bracelet</title>
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                <span>SmartBracelet</span>
            </div>
            <ul class="nav-links">
                <li><a href="htl.html">Accueil</a></li>
                <li><a href="dashbord.html" class="active">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container">
            <div class="dashboard-header">
                <h1><i class="fas fa-chart-line"></i> Tableau de Bord</h1>
                <div class="last-update">
                    <i class="fas fa-sync-alt"></i>
                    <span id="last-update-time">Dernière mise à jour: --</span>
                </div>
            </div>

            <div class="dashboard-grid">
                
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-clock"></i> Présence du Jour</h3>
                        <i class="fas fa-ellipsis-h"></i>
                    </div>
                    <div class="card-body">
                        <div id="attendance-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

                <!-- Graphique Fréquence Cardiaque -->
                <div class="dashboard-card full-width">
                    <div class="card-header">
                        <h3><i class="fas fa-heartbeat"></i> Fréquence Cardiaque - Dernières 24h</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="heartRateChart"></canvas>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-users"></i> Employés</h3>
                        <input type="text" id="search-employee" placeholder="Rechercher..." class="search-input">
                    </div>
                    <div class="card-body">
                        <div id="employees-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-bell"></i> Alertes Santé</h3>
                        <span class="badge" id="alert-count">0</span>
                    </div>
                    <div class="card-body">
                        <div id="alerts-list">
                            <div class="loading">Chargement...</div>
                        </div>
                    </div>
                </div>

              
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-thermometer-half"></i> Températures</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
